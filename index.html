<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a110c" />
    <meta name="description" content="让弹珠沿直线滚到头，把木托盘迷宫的每一格都染上色。步数越少越好。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="染色迷宫" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>染色迷宫</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <canvas id="stage" aria-label="游戏画面"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="tally" id="tally" hidden>
      <p class="tally-steps"><output id="steps">0</output><span>步</span></p>
      <p class="tally-par" id="par"></p>
    </div>

    <nav class="tools" id="tools" hidden>
      <button class="chip" id="btn-undo" type="button">撤销</button>
      <button class="chip" id="btn-restart" type="button">重玩</button>
      <button class="chip" id="btn-levels" type="button">选关</button>
      <button class="chip chip-icon" id="btn-sound" type="button" aria-label="声音" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" />
          <path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" />
          <path class="off" d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
        </svg>
      </button>
    </nav>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="stars" id="result-stars" role="img"></div>
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <div class="result-actions">
        <button class="chip" id="btn-again" type="button">再来一次</button>
        <button class="chip" id="btn-result-levels" type="button">选关</button>
        <button class="chip chip-main" id="btn-next" type="button">下一关</button>
      </div>
    </section>

    <!-- 选关树：关里点「选关」看到它。一块长木板上刻着一棵树，一关一个木片，上下滚动（见 src/ui/tree.ts） -->
    <section class="tree" id="tree" hidden aria-label="选关">
      <div class="tree-board" id="tree-board"></div>
    </section>

    <!-- 新手指引：第一次来的人先看到的分步弹层，盖在第 1 关上面，一步一页（见 src/ui/guide.ts）。
         木牌最上面刻着游戏名和一句"这是个什么游戏"，每一页都在；下面每页一段会动的小演示加一句话。
         第一步在电脑上演方向键、在触屏上演手指滑动，由样式表按设备分 -->
    <div class="guide" id="guide" hidden>
      <section class="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-title" aria-describedby="guide-intro">
        <header class="guide-head">
          <h1 class="guide-title" id="guide-title">染色迷宫</h1>
          <p class="guide-intro" id="guide-intro">一款滚动小球、给迷宫染色的益智游戏</p>
        </header>
        <p class="guide-count" id="guide-count"></p>

        <div class="guide-page" id="guide-page-1">
          <div class="demo demo-steer" aria-hidden="true">
            <div class="lane">
              <i class="trail"></i>
              <i class="ball"></i>
              <i class="finger"></i>
            </div>
            <div class="keys">
              <kbd class="key"><svg viewBox="0 0 24 24"><path d="M12 5.5l7.5 12h-15z" /></svg></kbd>
              <kbd class="key key-left"><svg viewBox="0 0 24 24"><path d="M5.5 12l12-7.5v15z" /></svg></kbd>
              <kbd class="key"><svg viewBox="0 0 24 24"><path d="M12 18.5l-7.5-12h15z" /></svg></kbd>
              <kbd class="key key-right"><svg viewBox="0 0 24 24"><path d="M18.5 12l-12 7.5v-15z" /></svg></kbd>
            </div>
          </div>
          <p class="guide-text"><span class="by-keys">方向键控制小球</span><span class="by-touch">滑动屏幕控制小球</span></p>
        </div>

        <div class="guide-page" id="guide-page-2" hidden>
          <div class="demo demo-roll" aria-hidden="true">
            <div class="lane">
              <i class="trail"></i>
              <i class="ball"></i>
            </div>
          </div>
          <p class="guide-text">小球会一直滚到撞墙才停</p>
        </div>

        <div class="guide-page" id="guide-page-3" hidden>
          <div class="demo demo-fill" aria-hidden="true">
            <div class="yard">
              <i class="trail trail-top"></i>
              <i class="trail trail-side"></i>
              <i class="trail trail-bottom"></i>
              <i class="ball"></i>
            </div>
            <div class="stars">
              <svg class="won" viewBox="0 0 24 24"><path d="M12 2.6l2.8 6 6.5.8-4.8 4.5 1.3 6.5L12 17.2 6.2 20.4l1.3-6.5L2.7 9.4l6.5-.8z" /></svg>
              <svg class="won" viewBox="0 0 24 24"><path d="M12 2.6l2.8 6 6.5.8-4.8 4.5 1.3 6.5L12 17.2 6.2 20.4l1.3-6.5L2.7 9.4l6.5-.8z" /></svg>
              <svg class="won" viewBox="0 0 24 24"><path d="M12 2.6l2.8 6 6.5.8-4.8 4.5 1.3 6.5L12 17.2 6.2 20.4l1.3-6.5L2.7 9.4l6.5-.8z" /></svg>
            </div>
          </div>
          <p class="guide-text">把所有格子都染上色就过关</p>
        </div>

        <div class="guide-foot">
          <ol class="guide-dots" aria-hidden="true">
            <li id="guide-dot-1"></li>
            <li id="guide-dot-2"></li>
            <li id="guide-dot-3"></li>
          </ol>
          <button class="chip chip-main" id="btn-guide-next" type="button">下一步</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
